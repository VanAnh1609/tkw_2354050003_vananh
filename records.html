<!doctype html>
<html lang="vi" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Dữ liệu giao dịch - ANNIE</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="./dist/output.css" />
  </head>

  <body
    class="min-h-screen bg-surface font-body text-ink antialiased dark:bg-surface-dark dark:text-ink-invert"
  >
    <main class="mx-auto w-full max-w-[1280px] px-5 py-12">
      <!-- HEADER -->
      <section class="mb-10">
        <p class="font-semibold text-brand-500">Buổi 5 - Dữ liệu động</p>

        <h1
          class="mt-2 font-display text-[32px] font-extrabold leading-tight lg:text-[42px]"
        >
          Danh sách giao dịch
        </h1>

        <p class="mt-3 max-w-[720px] text-muted dark:text-muted-invert">
          Dữ liệu được đọc từ file JSON và hiển thị bằng JavaScript.
        </p>
      </section>

      <!-- KHUNG DANH SÁCH -->
      <section
        class="overflow-hidden rounded-card border border-line bg-white dark:border-line-invert dark:bg-surface-dark-alt"
        aria-labelledby="records-title"
      >
        <div
          class="flex flex-wrap items-center justify-between gap-4 border-b border-line px-5 py-4 dark:border-line-invert"
        >
          <h2 id="records-title" class="font-display text-[22px] font-bold">
            Dữ liệu giao dịch
          </h2>

          <span
            id="record-count"
            class="text-[14px] text-muted dark:text-muted-invert"
          >
            0 bản ghi
          </span>
        </div>

        <!-- LOADING -->
        <div id="records-loading" class="space-y-3 p-5" aria-live="polite">
          <div class="h-12 animate-pulse rounded bg-brand-50"></div>
          <div class="h-12 animate-pulse rounded bg-brand-50"></div>
          <div class="h-12 animate-pulse rounded bg-brand-50"></div>

          <p class="text-center text-muted dark:text-muted-invert">
            Đang tải dữ liệu...
          </p>
        </div>

        <!-- ERROR -->
        <div id="records-error" class="hidden p-6 text-center" role="alert">
          <p id="records-error-message" class="font-medium text-red-600"></p>
        </div>

        <!-- EMPTY -->
        <div id="records-empty" class="hidden p-10 text-center">
          <p class="font-semibold">Không có dữ liệu để hiển thị.</p>

          <p class="mt-2 text-[14px] text-muted dark:text-muted-invert">
            Hãy thử lại sau hoặc khôi phục dữ liệu mẫu.
          </p>
        </div>

        <!-- DATA TABLE -->
        <div id="records-content" class="hidden overflow-x-auto">
          <table class="w-full min-w-[900px] border-collapse">
            <thead class="bg-brand-50 dark:bg-surface-dark">
              <tr class="text-left">
                <th class="px-4 py-3 text-[14px] font-semibold">Mã</th>

                <th class="px-4 py-3 text-[14px] font-semibold">
                  Người giao dịch
                </th>

                <th class="px-4 py-3 text-[14px] font-semibold">Loại</th>

                <th class="px-4 py-3 text-[14px] font-semibold">Trạng thái</th>

                <th class="px-4 py-3 text-[14px] font-semibold">Khối lượng</th>

                <th class="px-4 py-3 text-[14px] font-semibold">Số tiền</th>

                <th class="px-4 py-3 text-[14px] font-semibold">Ngày</th>
              </tr>
            </thead>

            <tbody
              id="records-body"
              class="divide-y divide-line dark:divide-line-invert"
            ></tbody>
          </table>
        </div>
      </section>
    </main>

    <!-- TEMPLATE TẠO TỪNG DÒNG -->
    <template id="row-template">
      <tr>
        <td
          data-cell="id"
          class="whitespace-nowrap px-4 py-4 text-[14px] font-medium"
        ></td>

        <td data-cell="trader" class="px-4 py-4 text-[14px]"></td>

        <td data-cell="category" class="px-4 py-4 text-[14px]"></td>

        <td data-cell="status" class="px-4 py-4 text-[14px]"></td>

        <td data-cell="weight" class="px-4 py-4 text-[14px]"></td>

        <td data-cell="amount" class="px-4 py-4 text-[14px]"></td>

        <td
          data-cell="date"
          class="whitespace-nowrap px-4 py-4 text-[14px]"
        ></td>
      </tr>
    </template>

    <script type="module" src="./js/records.js"></script>
  </body>
</html>
